// The Myriad addon plugin sets up the rest: Loom, Minecraft, Fabric and Myriad at the versions that Myriad release was
// built with, the dev client (`./gradlew runClient`, with Essentials), the check that you use only Myriad's API, and
// publishing. Its version is the Myriad release you build against; https://myriadclient.dev/docs/develop/setup lists
// what it does and the switches its dev client takes.
plugins {
	id 'dev.myriadclient.addon' version '1.0.0'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}
